services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ap
      POSTGRES_PASSWORD: ap
      POSTGRES_DB: ap_v3
    ports:
      - "5432:5432"
    volumes:
      - ap_v3_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ap -d ap_v3"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://ap:ap@postgres:5432/ap_v3
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             gunicorn app.main:app -k uvicorn.workers.UvicornWorker -b 0.0.0.0:8000 -w 2"

  celery-worker:
    build: .
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://ap:ap@postgres:5432/ap_v3
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A app.core.celery_app.celery_app worker --loglevel=info

  flower:
    build: .
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://ap:ap@postgres:5432/ap_v3
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - redis
    ports:
      - "5555:5555"
    command: celery -A app.core.celery_app.celery_app flower --port=5555

volumes:
  ap_v3_postgres_data:
