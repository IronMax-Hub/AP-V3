[project]
name = "ap-v3"
version = "0.1.0"
description = "Lawsikho Assignment Portal API — FastAPI/SQLAlchemy/Postgres rewrite of the Laravel Assignment Portal API"
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.32,<0.33",
    "gunicorn>=23.0,<24",
    "sqlalchemy[asyncio]>=2.0,<2.1",
    "asyncpg>=0.30,<0.31",
    "alembic>=1.13,<2",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "celery[redis]>=5.4,<6",
    "flower>=2.0,<3",
    "redis>=5.1,<6",
    "sentry-sdk[fastapi]>=2.17,<3",
    "pycryptodome>=3.21,<4",
    "phonenumbers>=8.13,<9",
    "httpx>=0.27,<0.28",
    "python-multipart>=0.0.12,<0.1",
    "structlog>=24.4,<25",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<0.25",
    "pytest-cov>=5.0,<6",
    "ruff>=0.7,<0.8",
    "black>=24.10,<25",
    "mypy>=1.13,<2",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
# Alembic revision files are machine-generated from script.py.mako on every
# `alembic revision` — not worth hand-conforming to project lint rules.
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.black]
line-length = 100
target-version = ["py311"]
extend-exclude = "alembic/versions"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
